name: Audit carte DIGIYLYFE
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-card-wording.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Contrôler le wording FG NAILS
        run: |
          echo '=== Mentions sensibles dans index.html ==='
          grep -inoE 'officiel|officielle|vérifi[a-zéèê]*|certifi[a-zéèê]*|garanti[a-zéèê]*|ambassadeur|sélectionné|partenaire|adhérent[a-zéèê]*' index.html | head -120 || true
