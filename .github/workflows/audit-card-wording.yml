name: Audit carte DIGIYLYFE
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-card-wording.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Contexte wording FG NAILS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          low=s.lower()
          for term in ['officielle','officiel','vérifi','certifi','garanti','ambassadeur','sélectionné','partenaire','adhérent']:
              start=0
              while True:
                  i=low.find(term,start)
                  if i<0: break
                  print('\nTERM',term,'AT',i)
                  print(s[max(0,i-180):i+260].replace('\n',' '))
                  start=i+len(term)
          PY
