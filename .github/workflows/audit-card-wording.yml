name: Audit carte DIGIYLYFE
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-card-wording.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OCR carte FG NAILS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-fra
          echo '=== fg-nails-carte-officielle.webp ==='
          tesseract 'fg-nails-carte-officielle.webp' stdout -l fra+eng 2>/dev/null || true
