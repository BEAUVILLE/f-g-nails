name: Corriger carte FG NAILS adhérente

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  correct-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Corriger la carte et le wording
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          p=Path('fg-nails-carte-officielle.webp')
          im=Image.open(p).convert('RGB')
          W,H=im.size
          sx,sy=W/900,H/1600
          s=min(sx,sy)
          d=ImageDraw.Draw(im)
          cream=(249,242,231); brown=(64,32,24); gold=(196,150,80)
          rect=(round(635*sx),round(1455*sy),round(875*sx),round(1582*sy))
          d.rounded_rectangle(rect,radius=max(8,round(18*s)),fill=cream,outline=(225,202,177),width=max(1,round(s)))
          fontp='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          f=ImageFont.truetype(fontp,max(12,round(28*s)))
          t='ADHÉRENTE'; bb=d.textbbox((0,0),t,font=f)
          d.text(((rect[0]+rect[2]-(bb[2]-bb[0]))/2,round(1482*sy)),t,font=f,fill=brown)
          f=ImageFont.truetype(fontp,max(12,round(24*s)))
          t='DIGIYLYFE'; bb=d.textbbox((0,0),t,font=f)
          d.text(((rect[0]+rect[2]-(bb[2]-bb[0]))/2,round(1528*sy)),t,font=f,fill=gold)
          im.save(p,'WEBP',quality=92,method=6)

          idx=Path('index.html')
          text=idx.read_text(encoding='utf-8')
          repl={
            'Carte officielle FG NAILS':'Carte FG NAILS · ADHÉRENTE DIGIYLYFE',
            'Fiche officielle FG NAILS':'Fiche FG NAILS · ADHÉRENTE DIGIYLYFE',
            'fiche officielle DIGIYLYFE':'fiche DIGIYLYFE',
            'Fiche officielle DIGIYLYFE':'Fiche DIGIYLYFE'
          }
          for a,b in repl.items(): text=text.replace(a,b)
          idx.write_text(text,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "DIGIYLYFE Bot"
          git config user.email "actions@users.noreply.github.com"
          git add fg-nails-carte-officielle.webp index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "FG NAILS : adhérente DIGIYLYFE"
          git push
